  <text
     x="30"
     y="35"
     class="title"
     id="text1"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:18px;line-height:normal;font-family:sans-serif">Sequence diagram — LLM selects list_rentals tool and gets result back</text>
  <!-- Participants -->
  <!-- x positions -->
  <!--  110  280  480  690  900 -->
  <g
     id="g14">
    <rect
       x="40"
       y="60"
       width="140"
       height="40"
       class="box"
       id="rect1" />
    <text
       x="110"
       y="85"
       text-anchor="middle"
       class="label"
       id="text2">User</text>
    <line
       x1="110"
       y1="100"
       x2="110"
       y2="580"
       class="lifeline"
       id="line2" />
    <rect
       x="200"
       y="60"
       width="160"
       height="40"
       class="box"
       id="rect2" />
    <text
       x="280"
       y="85"
       text-anchor="middle"
       class="label"
       id="text3">MCP Client</text>
    <text
       x="280"
       y="99"
       text-anchor="middle"
       class="small"
       id="text4">(client_ollama…)</text>
    <line
       x1="280"
       y1="100"
       x2="280"
       y2="580"
       class="lifeline"
       id="line4" />
    <rect
       x="400"
       y="60"
       width="160"
       height="40"
       class="box"
       id="rect4" />
    <text
       x="480"
       y="85"
       text-anchor="middle"
       class="label"
       id="text5">Ollama LLM</text>
    <text
       x="480"
       y="99"
       text-anchor="middle"
       class="small"
       id="text6">ChatOllama</text>
    <line
       x1="480"
       y1="100"
       x2="480"
       y2="580"
       class="lifeline"
       id="line6" />
    <rect
       x="600"
       y="60"
       width="180"
       height="40"
       class="box"
       id="rect6" />
    <text
       x="690"
       y="85"
       text-anchor="middle"
       class="label"
       id="text7">MCP Session</text>
    <text
       x="690"
       y="99"
       text-anchor="middle"
       class="small"
       id="text8">ClientSession</text>
    <line
       x1="690"
       y1="100"
       x2="690"
       y2="580"
       class="lifeline"
       id="line8" />
    <rect
       x="820"
       y="60"
       width="160"
       height="40"
       class="box"
       id="rect8" />
    <text
       x="900"
       y="85"
       text-anchor="middle"
       class="label"
       id="text9">MCP Server</text>
    <text
       x="900"
       y="99"
       text-anchor="middle"
       class="small"
       id="text10">FastMCP (stdio)</text>
    <line
       x1="900"
       y1="100"
       x2="900"
       y2="580"
       class="lifeline"
       id="line10" />
  </g>
  <!-- Messages -->
  <!-- y positions: start at 140, step ~45 -->
  <g
     id="g28">
    <!-- 1 -->
    <path
       class="msg"
       d="M110 140 L280 140"
       id="path14" />
    <text
       x="195"
       y="132"
       text-anchor="middle"
       class="label"
       id="text15">1) Enter query</text>
    <!-- 2 -->
    <path
       class="msg"
       d="M280 185 L480 185"
       id="path15" />
    <text
       x="380"
       y="177"
       text-anchor="middle"
       class="label"
       id="text16">2) Send messages to LLM</text>
    <!-- Note: tools are bound after list_tools -->
    <rect
       x="325"
       y="205"
       width="310"
       height="52"
       class="note"
       id="rect16" />
    <text
       x="335"
       y="225"
       class="small"
       id="text17">Client previously connected to MCP server, called list_tools()</text>
    <text
       x="335"
       y="242"
       class="small"
       id="text18">and bound tool schemas to the LLM (“tool calling”).</text>
    <!-- 3 -->
    <path
       class="return"
       d="M480 275 L280 275"
       id="path18" />
    <text
       x="380"
       y="267"
       text-anchor="middle"
       class="label"
       id="text19">3) LLM decides: call tool list_rentals</text>
    <!-- 4 -->
    <path
       class="msg"
       d="M280 320 L690 320"
       id="path19" />
    <text
       x="485"
       y="312"
       text-anchor="middle"
       class="label"
       id="text20">4) session.call_tool(&quot;list_rentals&quot;, args)</text>
    <!-- 5 -->
    <path
       class="msg"
       d="M690 365 L900 365"
       id="path20" />
    <text
       x="795"
       y="357"
       text-anchor="middle"
       class="label"
       id="text21">5) MCP stdio request</text>
    <!-- Note: local file read replaces the old Tomcat HTTP round-trip -->
    <rect
       x="700"
       y="385"
       width="330"
       height="50"
       class="greennote"
       id="rect20" />
    <text
       x="710"
       y="405"
       class="small"
       id="text20b">MCP Server reads dataset/rentals.csv directly from local</text>
    <text
       x="710"
       y="422"
       class="small"
       id="text20c">disk (csv.DictReader) - no network call, no Tomcat.</text>
    <!-- 6 return -->
    <path
       class="return"
       d="M900 460 L690 460"
       id="path24" />
    <text
       x="795"
       y="452"
       text-anchor="middle"
       class="label"
       id="text25">6) MCP stdio response (tool result string)</text>
    <!-- 7 -->
    <path
       class="msg"
       d="M690 505 L480 505"
       id="path26" />
    <text
       x="585"
       y="497"
       text-anchor="middle"
       class="label"
       id="text27">7) ToolMessage(result) added to history</text>
    <!-- 8 -->
    <path
       class="return"
       d="M480 550 L110 550"
       id="path27" />
    <text
       x="295"
       y="542"
       text-anchor="middle"
       class="label"
       id="text28">8) Final answer to user (includes tool output)</text>
  </g>
