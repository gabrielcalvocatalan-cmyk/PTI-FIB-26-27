  <defs
     id="defs1">
    <marker
       id="arrow"
       markerWidth="12"
       markerHeight="12"
       refX="10"
       refY="6"
       orient="auto">
      <path
         d="M0,0 L12,6 L0,12 Z"
         id="path1" />
    </marker>
    <style
       id="style1">
      .title { font: 700 18px sans-serif; }
      .label { font: 12px sans-serif; }
      .small { font: 11px sans-serif; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.3; rx: 8; ry: 8; }
      .lifeline { stroke: #111; stroke-width: 1; stroke-dasharray: 6 6; }
      .msg { stroke: #111; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .return { stroke: #111; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .note { fill: #fff7cc; stroke: #a67c00; stroke-width: 1; rx: 8; ry: 8; }
      .greennote { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1; rx: 8; ry: 8; }
      .divider { stroke: #bbb; stroke-width: 1; }
    </style>
